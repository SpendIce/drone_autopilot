[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-autopilot"
version = "0.1.0"
description = "Simulator-first RGB-D drone autopilot training and safety scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "pandas>=2",
  "pyarrow>=14",
]

[project.optional-dependencies]
training = [
  "torch>=2.2",
  "torchvision>=0.17",
]
sim = [
  "airsim>=1.8",
]
dev = [
  "pytest>=8",
]

[project.scripts]
drone-autopilot = "drone_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["drone_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
